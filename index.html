      content="Benjamin Park's portfolio: projects, GitHub, LinkedIn, and resume."
    />
    <meta name="twitter:image" content="https://benpark.surge.sh/assets/avatar.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0,0&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.min.css" />
  </head>
  <body>
    <main>
      <div class="greeting-row">
        <span class="greeting-avatar" aria-hidden="true"></span>
        <h1 id="greeting">hi, i'm ben.</h1>
        <div id="work-filter" class="work-filter is-hidden" aria-hidden="true">
          <button
            id="work-filter-toggle"
            class="work-filter-toggle"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="work-filter-label">
              <span id="work-filter-current-year" class="work-filter-label-text">over the years</span>
              <svg class="work-filter-squiggle" viewBox="0 0 120 16" preserveAspectRatio="none" aria-hidden="true">
                <path pathLength="100" d="M1 9 C6 9 6 3 13 3 C20 3 20 9 27 9 C34 9 34 3 41 3 C48 3 48 9 55 9 C62 9 62 3 69 3 C76 3 76 9 83 9 C90 9 90 3 97 3 C104 3 104 9 111 9 C116 9 118 6 119 5"/>
              </svg>
            </span>
            <span class="material-symbols-rounded material-glyph work-filter-arrow">expand_circle_down</span>
          </button>
          <div id="work-filter-menu" class="work-filter-menu" role="listbox" aria-label="filter work by year"></div>
        </div>
      </div>
      <a id="projects-toggle" href="#" aria-expanded="false">
        <span class="hover-icon projects-toggle-icon" aria-hidden="true">
          <span class="material-symbols-rounded material-glyph projects-glyph projects-glyph-default">category</span>
          <span class="material-symbols-rounded material-glyph projects-glyph projects-glyph-back">arrow_circle_left</span>
        </span>
        <span class="projects-label">work</span>
      </a>
      <a
        class="has-extension"
        data-secondary-link
        href="https://github.com/benpark202"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="hover-icon" aria-hidden="true"
          ><i class="fa-brands fa-github"></i
        ></span>
        github
        <span class="link-extension" aria-hidden="true">
          <span class="link-slash">/</span><span class="link-handle">benpark202</span>
        </span>
      </a>
      <a
        class="has-extension"
        data-secondary-link
        href="https://www.linkedin.com/in/benjajpark/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="hover-icon" aria-hidden="true"
          ><i class="fa-brands fa-linkedin"></i
        ></span>
        linkedin
        <span class="link-extension" aria-hidden="true">
          <span class="link-slash">/</span><span class="link-handle">benjajpark</span>
        </span>
      </a>
      <a id="resume-link" href="#" data-secondary-link>
        <span class="hover-icon" aria-hidden="true"
          ><span class="material-symbols-rounded material-glyph">list_alt</span
        ></span>
        resume
      </a>
      <div id="work-links" class="work-links"></div>
    </main>
    <div id="custom-cursor" class="custom-cursor" aria-hidden="true"></div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="switch to dark mode">
      <span class="theme-glyph" aria-hidden="true">
        <span class="material-symbols-rounded theme-symbol theme-sun">sunny</span>
        <span class="material-symbols-rounded theme-symbol theme-moon">dark_mode</span>
      </span>
    </button>
    <script type="module" src="./lib/main.js"></script>
  </body>
</html>
